<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Page Not Found - Legacy Concierge</title>
		<script>
		// GitHub Pages SPA redirect script
		// Handles clean URLs by redirecting to the correct page
		(() => {
			// Get the current path
			const path = window.location.pathname;
			const search = window.location.search;
			const hash = window.location.hash;

			// If the URL ends without a trailing slash and doesn't have an extension,
			// try adding /index.html
			if (!path.endsWith("/") && !path.includes(".")) {
				// Check if this might be a clean URL for an existing page
				const redirectPath = `${path}/`;

				// Preserve query string and hash
				const fullRedirect = redirectPath + search + hash;

				// Use sessionStorage to prevent infinite redirects
				const redirectKey = `redirect_${path}`;
				if (!sessionStorage.getItem(redirectKey)) {
					sessionStorage.setItem(redirectKey, "true");
					// Clean up after redirect
					setTimeout(() => {
						sessionStorage.removeItem(redirectKey);
					}, 5000);

					window.location.replace(fullRedirect);
					return;
				}
			}

			// If we're still here, show the 404 page
			sessionStorage.clear();
		})();
		</script>
		<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
		}
		body {
			font-family: system-ui, -apple-system, sans-serif;
			background: linear-gradient(135deg, #1a2f2f 0%, #2d4a4a 100%);
			min-height: 100vh;
			display: flex;
			align-items: center;
			justify-content: center;
			color: white;
		}
		.container {
			text-align: center;
			padding: 2rem;
			max-width: 600px;
		}
		h1 {
			font-size: 6rem;
			font-weight: 200;
			margin-bottom: 1rem;
			color: #60aaa3;
		}
		h2 {
			font-size: 1.5rem;
			font-weight: 400;
			margin-bottom: 1.5rem;
			color: rgba(255, 255, 255, 0.9);
		}
		p {
			color: rgba(255, 255, 255, 0.7);
			margin-bottom: 2rem;
			line-height: 1.6;
		}
		.btn {
			display: inline-block;
			padding: 1rem 2rem;
			background: #60aaa3;
			color: white;
			text-decoration: none;
			border-radius: 9999px;
			font-weight: 500;
			transition: background 0.2s;
		}
		.btn:hover {
			background: #4d9992;
		}
		.links {
			margin-top: 2rem;
			display: flex;
			gap: 1rem;
			justify-content: center;
			flex-wrap: wrap;
		}
		.links a {
			color: rgba(255, 255, 255, 0.7);
			text-decoration: none;
			padding: 0.5rem 1rem;
			border: 1px solid rgba(255, 255, 255, 0.2);
			border-radius: 0.5rem;
			transition: all 0.2s;
		}
		.links a:hover {
			color: white;
			border-color: rgba(255, 255, 255, 0.5);
		}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>404</h1>
			<h2>Page Not Found</h2>
			<p>
				The page you're looking for doesn't exist or has been moved. Let us help
				you find what you need.
			</p>
			<a href="./" class="btn">Return Home</a>
			<div class="links">
				<a href="./pages/services">Services</a>
				<a href="./pages/about">About</a>
				<a href="./pages/team">Team</a>
				<a href="./pages/contact">Contact</a>
			</div>
		</div>
	</body>
</html>
